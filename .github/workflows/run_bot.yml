name: Bot Automático de Noticias

on:
  schedule:
    - cron: '*/30 * * * *'  # Se ejecuta automáticamente cada 30 minutos
  workflow_dispatch:       # Permite probarlo manualmente cuando quieras

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install groq requests

      - name: Ejecutar Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: python bot.py

      - name: Guardar historial de duplicados
        run: |
          git config --global user.name "Bot Automatizado"
          git config --global user.email "bot@canal1.tv"
          git add historial.txt || true
          git commit -m "Actualizar historial [skip ci]" || exit 0
          git push
